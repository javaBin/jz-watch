micronaut:
  application:
    name: backend
  http:
    client:
      read-timeout: 300s
      max-header-size: 65536
      http2:
        max-header-list-size: 65536
  router:
    static-resources:
      default:
        enabled: true
        mapping: /**
        paths: classpath:public
  serde:
    jackson:
      read-features:
        ALLOW_UNQUOTED_CONTROL_CHARS: true
        ALLOW_UNESCAPED_CONTROL_CHARS: true
jackson:
  parser:
    allowUnquotedControlChars: true


datasources:
  default:
    url: ${DB_URL:`jdbc:postgresql://localhost:5432/postgres?currentSchema=watch`}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    dialect: POSTGRES

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration
      create-schemas: true
      default-schema: watch
      schemas: watch

google:
  api:
    key: ${GOOGLE_API_KEY:}

gemini:
  model: ${GEMINI_MODEL:gemini-2.5-flash}

ai:
  provider: ${AI_PROVIDER:gemini}

openai:
  api:
    url: ${OPENAI_API_URL:http://localhost:8888/v1}
    key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:local-model}
